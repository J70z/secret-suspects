<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>سرّنا بيننا</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap');
:root{--ink:#24324a;--muted:#71809a;--cream:#fffaf2;--paper:#fff;--lav:#e9e3ff;--mint:#c9f4df;--peach:#ffd9c5;--yellow:#ffeaa7;--pink:#ffd5e5;--blue:#cfe8ff;--accent:#7158d8;--danger:#e96b78;--shadow:0 16px 40px #3e326414,0 3px 10px #3e326414}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#fff 0 8%,transparent 28%),linear-gradient(135deg,#fff8e8,#f3eeff 52%,#e8f7ff);color:var(--ink);font-family:'Noto Sans Arabic','Baloo 2',system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1240px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:18px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 9px 0 #5140a6;transform:rotate(-5deg)}h1,h2,h3,p{margin:0}.brand h1{font-size:24px}.brand small{color:var(--muted);display:block}.toolbar{display:flex;gap:8px}.ghost,.pill{background:#ffffffaa;border:1px solid #ffffff;box-shadow:0 5px 15px #4b3d7910;padding:10px 14px;border-radius:14px;color:var(--ink)}.primary{background:var(--accent);color:#fff;padding:13px 20px;border-radius:15px;box-shadow:0 5px 0 #5140a6;font-weight:800}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #5140a6}.danger{background:#ffe1e4;color:#a53848;padding:11px 15px;border-radius:13px}.layout{display:grid;grid-template-columns:1fr 300px;gap:18px}.card{background:#ffffffd9;border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow);padding:24px}.hero{min-height:490px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero:after{content:'?';position:absolute;left:5%;bottom:-55px;font-size:280px;color:#7158d811;line-height:1}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.04em;margin-bottom:10px}.hero h2{font-size:clamp(34px,6vw,68px);line-height:1.05;max-width:650px;margin-bottom:16px}.hero p{font-size:18px;color:var(--muted);max-width:610px;line-height:1.8;margin-bottom:26px}.actions{display:flex;flex-wrap:wrap;gap:12px}.form{display:grid;gap:13px;max-width:520px}.form label{font-weight:700;font-size:14px}.form input,.form select{width:100%;padding:13px 15px;border:2px solid #e9e5f6;border-radius:14px;background:#fff;color:var(--ink);outline:0}.form input:focus,.form select:focus{border-color:var(--accent)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.section-title h2{font-size:26px}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:18px;background:var(--lav)}.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--yellow)}.stat strong{display:block;font-size:28px}.players{display:grid;gap:10px}.player{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#fff}.avatar{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}.player .meta{flex:1}.player .meta small{color:var(--muted);display:block}.badge{padding:5px 9px;border-radius:10px;font-size:12px;background:var(--mint);white-space:nowrap}.badge.off{background:#f0eef5;color:var(--muted)}.badge.elim{background:var(--pink);color:#a33b62}.phase{padding:15px 17px;border-radius:17px;background:var(--lav);margin-bottom:14px}.phase strong{font-size:20px}.timer{font-size:42px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}.turn{background:var(--peach);padding:17px;border-radius:18px;line-height:1.8}.turn strong{font-size:20px}.ability{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #edeafa;border-radius:15px;padding:11px;text-align:right}.ability.used{opacity:.45}.ability .ico{font-size:24px}.log{max-height:240px;overflow:auto;display:grid;gap:8px}.log div{font-size:13px;padding:9px 11px;border-radius:12px;background:#f7f5fc;color:#61708b}.notice{padding:14px 16px;border-radius:15px;background:var(--yellow);margin:12px 0}.error{background:#ffe1e4;color:#9b3f4c}.success{background:var(--mint);color:#296a50}.identity{font-size:22px;font-weight:800;color:var(--accent)}.guess-row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:9px;align-items:center;padding:10px;background:#fff;border-radius:15px;margin-bottom:9px}.guess-row input{padding:10px;border:1px solid #e5e1f2;border-radius:10px;width:100%}.center{text-align:center}.big-emoji{font-size:72px;margin-bottom:8px}.footer{color:#8791a4;font-size:12px;text-align:center;margin-top:18px}.modal{position:fixed;inset:0;background:#2b235766;display:grid;place-items:center;padding:20px;z-index:4}.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none!important}.rtl{text-align:right}.ltr{direction:ltr;text-align:left}@media(max-width:850px){.app{padding:14px}.layout{grid-template-columns:1fr}.hero{min-height:430px}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.topbar{align-items:flex-start}.brand h1{font-size:20px}.guess-row{grid-template-columns:1fr}.toolbar{flex-wrap:wrap;justify-content:flex-end}.card{padding:18px;border-radius:21px}}
</style></head>
<body><div id="app"></div><div id="modal" class="modal hidden"></div>
<script>
const app=document.querySelector('#app'),modal=document.querySelector('#modal');let socket=null,state=null,screen='home',lang=localStorage.lang||'ar',roomCode=localStorage.roomCode||'',resumeToken=localStorage.resumeToken||'',timerHandle;
const t={ar:{brand:'سرّنا بيننا',tag:'لعبة الشك والضحك للأصدقاء',play:'ابدأ غرفة',join:'انضم لغرفة',rules:'كيف نلعب؟',name:'اسمك الظاهر',code:'كود الغرفة',create:'إنشاء الغرفة',joinNow:'انضم الآن',back:'رجوع',ready:'أنا جاهز',unready:'إلغاء الجاهزية',start:'ابدأ المباراة',players:'اللاعبون',settings:'إعدادات الغرفة',category:'الفئة',cartoons:'كرتون',anime:'أنمي',movies:'أفلام',people:'أشخاص حقيقيون',items:'أشياء',questionTimer:'وقت السؤال',suspicionTimer:'وقت الاشتباه',guessTimer:'وقت التخمين',save:'حفظ',identity:'هويتك السرية',identityHint:'اكتب شخصية أو غرضًا يناسب الفئة. لن يراه أحد.',lock:'تأكيد الهوية',waiting:'بانتظار بقية اللاعبين',question:'جولة الأسئلة',suspicion:'جولة الاشتباه',guessing:'جولة التخمين',results:'النتائج',voting:'تصويت طارئ',victory:'الفائز',done:'انتهيت',cancel:'إلغاء السؤال',redirect:'تحويل السؤال',backAbility:'عليّ الدور',submit:'إرسال',finish:'إنهاء التخمينات',callVote:'طلب تصويت',abstain:'امتناع',playAgain:'العبوا مجددًا',copy:'نسخ رابط الدعوة',copied:'تم النسخ',rulesText:'كل لاعب يختار هوية سرية. في كل جولة تسألون بعضكم شفهيًا، ثم يرسل كل لاعب تخميناته سرًا. من تُكتشف هويته يُقصى. آخر لاعب باقٍ يفوز.',round:'الجولة',phase:'المرحلة',remaining:'متبقٍ',active:'على قيد اللعب',eliminated:'مقصى',used:'مستخدمة',unused:'متاحة',room:'الغرفة',publicLog:'سجل الأحداث',noPlayers:'لا يوجد لاعبون بعد',leader:'القائد',spectator:'مشاهد',identityLocked:'تم التأكيد',notLocked:'لم يؤكد',voteInfo:'اختر لاعبًا للتصويت عليه أو امتنع.',winnerText:'أحسنت! بقيت حتى النهاية.',newRoom:'غرفة جديدة',error:'حدث خطأ',tutorial:'اسأل شفهيًا، استخدم قدرتك في الوقت المناسب، ولا تكشف هويتك.'},en:{brand:'Secret Suspects',tag:'A social deduction party game',play:'Create room',join:'Join room',rules:'How to play',name:'Display name',code:'Room code',create:'Create room',joinNow:'Join now',back:'Back',ready:'Ready',unready:'Unready',start:'Start match',players:'Players',settings:'Room settings',category:'Category',cartoons:'Cartoons',anime:'Anime',movies:'Movies',people:'Real People',items:'Items',questionTimer:'Question time',suspicionTimer:'Suspicion time',guessTimer:'Guess time',save:'Save',identity:'Your secret identity',identityHint:'Enter a character or item matching the category. Nobody else will see it.',lock:'Lock identity',waiting:'Waiting for the other players',question:'Question round',suspicion:'Suspicion round',guessing:'Guessing round',results:'Results',voting:'Emergency vote',victory:'Winner',done:'Done',cancel:'Cancel question',redirect:'Redirect question',backAbility:'Back at you',submit:'Submit',finish:'Finish guesses',callVote:'Call a vote',abstain:'Abstain',playAgain:'Play again',copy:'Copy invite link',copied:'Copied',rulesText:'Everyone chooses a secret identity. Each round you ask questions out loud, then privately submit guesses. Correctly identified players are eliminated. The last player standing wins.',round:'Round',phase:'Phase',remaining:'remaining',active:'Active',eliminated:'Eliminated',used:'Used',unused:'Available',room:'Room',publicLog:'Activity log',noPlayers:'No players yet',leader:'Leader',spectator:'Spectator',identityLocked:'Locked',notLocked:'Not locked',voteInfo:'Choose a player to vote for or abstain.',winnerText:'You survived to the end.',newRoom:'New room',error:'Something went wrong',tutorial:'Ask out loud, use your ability at the right moment, and protect your identity.'}};
const L=()=>t[lang];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function send(type,data={}){if(socket?.readyState===1)socket.send(JSON.stringify({type,...data}))}function connect(){if(socket&&socket.readyState<2)return;const proto=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${proto}://${location.host}/ws`);socket.onopen=()=>{if(roomCode)send('join_room',{roomCode,resumeToken,name:localStorage.name||''})};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){state=m;roomCode=m.roomCode;localStorage.roomCode=roomCode;localStorage.resumeToken=m.me?.resumeToken||resumeToken;screen=m.phase==='lobby'?'lobby':m.phase==='identity'?'identity':m.phase;render()}if(m.type==='error')flash(m.message||L().error,true)};socket.onclose=()=>{if(screen!=='home')flash(lang==='ar'?'انقطع الاتصال، نحاول العودة...':'Connection lost, reconnecting...',true);setTimeout(connect,1200)}}
function flash(msg,err=false){const el=document.querySelector('#flash');if(el){el.className='notice '+(err?'error':'success');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2800)}}
function layout(content,side=true){return `<div class="topbar"><div class="brand"><div class="logo">?</div><div><h1>${L().brand}</h1><small>${L().tag}</small></div></div><div class="toolbar"><button class="ghost" onclick="toggleLang()">${lang==='ar'?'EN':'عربي'}</button>${state?`<button class="ghost" onclick="copyInvite()">${L().copy}</button>`:''}</div></div><div id="flash" class="notice hidden"></div>${side?`<div class="layout"><main>${content}</main><aside>${sidePanel()}</aside></div>`:`<main>${content}</main>`}<div class="footer">${L().tutorial}</div>`}
function sidePanel(){if(!state)return '';return `<div class="card"><div class="section-title"><h3>${L().players}</h3><span class="pill">${state.players.length}/10</span></div><div class="players">${state.players.map(p=>`<div class="player"><div class="avatar" style="background:${p.color}">${esc(p.name[0]||'?')}</div><div class="meta"><strong>${esc(p.name)}</strong><small>${p.id===state.leaderId?'★ '+L().leader:''} ${p.eliminated?'· '+L().eliminated:p.spectator?'· '+L().spectator:''}</small></div><span class="badge ${p.connected?'':'off'}">${p.connected?'●':'○'}</span></div>`).join('')}</div></div><div class="card" style="margin-top:18px"><div class="section-title"><h3>${L().publicLog}</h3></div><div class="log">${(state.log||[]).slice().reverse().map(e=>`<div>${esc(e.text)}</div>`).join('')||`<div>${L().noPlayers}</div>`}</div></div>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(!state||screen==='home')return renderHome();if(screen==='lobby')return renderLobby();if(screen==='identity')return renderIdentity();if(screen==='question'||screen==='suspicion')return renderTurn();if(screen==='guessing')return renderGuessing();if(screen==='results')return renderResults();if(screen==='voting')return renderVoting();if(screen==='victory')return renderVictory();renderHome()}
function renderHome(){app.innerHTML=layout(`<section class="card hero"><div class="eyebrow">${L().tag}</div><h2>${lang==='ar'?'مين يعرف سرّك؟':'Who can uncover your secret?'}</h2><p>${L().rulesText}</p><div class="actions"><button class="primary" onclick="screen='create';renderCreate()">${L().play}</button><button class="ghost" onclick="screen='join';renderJoin()">${L().join}</button><button class="ghost" onclick="showRules()">${L().rules}</button></div></section>`,false)}
function authCard(mode){return `<section class="card"><div class="section-title"><h2>${mode==='create'?L().create:L().joinNow}</h2><button class="ghost" onclick="renderHome()">${L().back}</button></div><div class="form"><label>${L().name}<input id="name" maxlength="24" placeholder="${lang==='ar'?'مثال: ليان':'e.g. Alex'}" value="${esc(localStorage.name||'')}"/></label>${mode==='join'?`<label>${L().code}<input id="code" maxlength="8" placeholder="AB12CD"/></label>`:''}<button class="primary" onclick="${mode==='create'?'createRoom()':'joinRoom()'}">${mode==='create'?L().create:L().joinNow}</button></div></section>`}
function renderCreate(){app.innerHTML=layout(authCard('create'),false)}function renderJoin(){app.innerHTML=layout(authCard('join'),false)}
function createRoom(){const name=document.querySelector('#name').value;localStorage.name=name;connect();setTimeout(()=>send('create_room',{name}),200)}function joinRoom(){const name=document.querySelector('#name').value,code=document.querySelector('#code').value;localStorage.name=name;roomCode=code.toUpperCase();localStorage.roomCode=roomCode;connect();setTimeout(()=>send('join_room',{roomCode,name}),200)}
function renderLobby(){const s=state;const settings=s.settings;app.innerHTML=layout(`<section class="card"><div class="phase"><div class="eyebrow">${L().room} ${s.roomCode}</div><strong>${L().waiting}</strong><div class="muted">${s.players.length}/10</div></div><div class="section-title"><h2>${L().settings}</h2><span class="pill">${s.category?L()[s.category]:''}</span></div><div class="grid2"><div class="stat"><span>${L().category}</span><strong>${L()[settings.category]}</strong></div><div class="stat"><span>${L().questionTimer}</span><strong>${settings.questionSeconds}s</strong></div></div>${s.me.id===s.leaderId?`<div class="form" style="margin-top:18px"><label>${L().category}<select id="category">${['cartoons','anime','movies','people','items'].map(c=>`<option value="${c}" ${c===settings.category?'selected':''}>${L()[c]}</option>`).join('')}</select></label><label>${L().questionTimer}<select id="qtime"><option>15</option><option>30</option><option selected>45</option><option>60</option><option>90</option></select></label><button class="ghost" onclick="saveSettings()">${L().save}</button></div>`:''}<div class="actions" style="margin-top:22px"><button class="primary" onclick="send('ready')">${s.players.find(p=>p.id===s.me.id)?.ready?L().unready:L().ready}</button>${s.me.id===s.leaderId?`<button class="primary" onclick="send('start_match')">${L().start}</button>`:''}<button class="danger" onclick="send('leave');state=null;roomCode='';renderHome()">${L().back}</button></div></section>`) }
function saveSettings(){send('set_settings',{settings:{category:document.querySelector('#category').value,questionSeconds:Number(document.querySelector('#qtime').value),suspicionSeconds:30,guessSeconds:60,language:lang}})}
function renderIdentity(){const s=state;const locked=s.me.identityLocked;app.innerHTML=layout(`<section class="card center"><div class="big-emoji">🕵️</div><div class="eyebrow">${L().category}: ${L()[s.category]}</div><h2>${locked?L().waiting:L().identity}</h2><p class="muted">${locked?L().identityLocked:L().identityHint}</p>${locked?`<div class="notice success">✓ ${L().identityLocked}</div>`:`<div class="form" style="margin:22px auto"><input id="identity" maxlength="80" placeholder="${L().identity}"/><button class="primary" onclick="lockIdentity()">${L().lock}</button></div>`}<div class="grid3" style="margin-top:20px"><div class="stat"><span>${L().players}</span><strong>${s.players.length}</strong></div><div class="stat"><span>${L().active}</span><strong>${s.players.filter(p=>!p.eliminated).length}</strong></div><div class="stat"><span>${L().round}</span><strong>1</strong></div></div></section>`)}
function lockIdentity(){send('set_identity',{identity:document.querySelector('#identity').value})}
function tick(){clearTimeout(timerHandle);timerHandle=setInterval(()=>{document.querySelectorAll('[data-timer]').forEach(el=>{const end=Number(el.dataset.timer);el.textContent=Math.max(0,Math.ceil((end-(Date.now()+(state?.serverNow-Date.now()||0)))/1000))+'s'})},500)}
function renderTurn(){const s=state,turn=s.currentTurn,me=s.me,isQ=s.phase==='question',q=s.players.find(p=>p.id===turn?.questionerId),target=s.players.find(p=>p.id===turn?.targetId);const myTurn=turn?.questionerId===me.id||turn?.targetId===me.id;app.innerHTML=layout(`<section class="card"><div class="phase"><div class="eyebrow">${L()[s.phase]}</div><strong>${L().round} ${s.round}</strong><div class="timer" data-timer="${turn?.endsAt||s.phaseEndsAt}">--</div></div><div class="turn"><strong>${q?.name||'—'} → ${target?.name||'—'}</strong><div>${isQ?(lang==='ar'?'اسأل سؤالك شفهيًا ثم اضغط «انتهيت».':'Ask out loud, then press Done.'):(lang==='ar'?'اختر شخصًا واشتبِه به شفهيًا.':'Choose someone and ask a suspicion question out loud.')}</div></div>${isQ&&me.id===turn?.targetId?`<div class="grid3" style="margin-top:16px">${[['cancel','🛑',L().cancel],['redirect','🔀',L().redirect],['back','↩️',L().backAbility]].map(([a,i,n])=>`<button class="ability ${me.abilities[a]?'used':''}" onclick="useAbility('${a}')"><span class="ico">${i}</span><span><b>${n}</b><small>${me.abilities[a]?' '+L().used:' '+L().unused}</small></span></button>`).join('')}</div>`:''}${!isQ&&myTurn?`<div class="form" style="margin-top:16px"><label>${L().players}<select id="susTarget">${(turn.eligibleIds||[]).map(id=>{const p=s.players.find(x=>x.id===id);return `<option value="${id}" ${id===turn.targetId?'selected':''}>${esc(p?.name)}</option>`}).join('')}</select></label><button class="ghost" onclick="send('submit_suspicion_target',{targetId:document.querySelector('#susTarget').value})">${L().save}</button></div>`:''}<div class="actions" style="margin-top:18px">${myTurn?`<button class="primary" onclick="send('done_turn')">${L().done}</button>`:''}${(s.phase==='results'||s.phase==='lobby')&&s.settings.voteEnabled?`<button class="ghost" onclick="send('call_vote')">${L().callVote}</button>`:''}</div></section>`);tick()}
function renderGuessing(){const s=state,alive=s.players.filter(p=>!p.eliminated&&p.id!==s.me.id),guesses=s.me.guesses||{};app.innerHTML=layout(`<section class="card"><div class="phase"><div class="eyebrow">${L().guessing}</div><strong>${L().round} ${s.round}</strong><div class="timer" data-timer="${s.phaseEndsAt}">--</div></div><p class="muted">${lang==='ar'?'اكتب تخمينًا لكل لاعب أو اتركه فارغًا إن كان مسموحًا.':'Enter a guess for each opponent, or leave blank if skipping is allowed.'}</p><div style="margin-top:18px">${alive.map(p=>`<div class="guess-row"><b>${esc(p.name)}</b><input data-guess="${p.id}" value="${esc(guesses[p.id]||'')}" placeholder="${L().identity}" ${s.me.submittedGuesses?'disabled':''}/><span>${guesses[p.id]?'✓':''}</span></div>`).join('')}</div><div class="actions"><button class="primary" onclick="saveGuesses()" ${s.me.submittedGuesses?'disabled':''}>${L().finish}</button>${s.settings.voteEnabled?`<button class="ghost" onclick="send('call_vote')">${L().callVote}</button>`:''}</div></section>`);tick()}
function saveGuesses(){document.querySelectorAll('[data-guess]').forEach(i=>{if(i.value.trim())send('submit_guess',{targetId:i.dataset.guess,identity:i.value})});setTimeout(()=>send('finish_guesses'),120)}
function renderResults(){const s=state;app.innerHTML=layout(`<section class="card"><div class="eyebrow">${L().results}</div><h2>${s.results?.length?L().eliminated:'No elimination'}</h2>${s.results?.length?s.results.map(r=>`<div class="notice ${r.reason==='vote'?'':'error'}"><b>${esc(r.name)}</b> — ${esc(r.identity)}<br/><span>${r.reason==='vote'?L().voting:(lang==='ar'?'تم تخمينه بواسطة: ':'Correctly guessed by: ')+esc(r.guessedBy.join(', '))}</span></div>`).join(''):`<div class="notice">${lang==='ar'?'لم يصب أحد هذه المرة.':'Nobody guessed correctly this time.'}</div>`}<p class="muted">${lang==='ar'?'ستبدأ الجولة التالية تلقائيًا.':'The next round will begin automatically.'}</p></section>`)}
function renderVoting(){const s=state;app.innerHTML=layout(`<section class="card"><div class="eyebrow">${L().voting}</div><h2>${L().callVote}</h2><p class="muted">${L().voteInfo}</p><div class="players" style="margin:18px 0">${s.vote.targetIds.map(id=>{const p=s.players.find(x=>x.id===id);return `<button class="player" onclick="send('cast_vote',{targetId:'${id}'})"><div class="avatar" style="background:${p.color}">${esc(p.name[0])}</div><div class="meta"><strong>${esc(p.name)}</strong></div></button>`}).join('')}<button class="ghost" onclick="send('cast_vote',{targetId:null})">${L().abstain}</button></div></section>`)}
function renderVictory(){const s=state;app.innerHTML=layout(`<section class="card center"><div class="big-emoji">🏆</div><div class="eyebrow">${L().victory}</div><h2>${esc(s.winner?.name||'—')}</h2><p>${L().winnerText}</p>${s.winnerIdentity?`<div class="notice success">${L().identity}: <span class="identity">${esc(s.winnerIdentity)}</span></div>`:''}<div class="actions" style="justify-content:center;margin-top:18px"><button class="primary" onclick="send('play_again')">${L().playAgain}</button><button class="ghost" onclick="state=null;roomCode='';renderHome()">${L().newRoom}</button></div></section>`)}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.lang=lang;render()}function useAbility(a){send('use_ability',{ability:a})}function copyInvite(){navigator.clipboard?.writeText(location.origin+'/?room='+state.roomCode);flash(L().copied)}function showRules(){modal.classList.remove('hidden');modal.innerHTML=`<div class="card"><div class="section-title"><h2>${L().rules}</h2><button class="ghost" onclick="modal.classList.add('hidden')">×</button></div><p style="line-height:2">${L().rulesText}</p><div class="notice" style="margin-top:16px">${L().tutorial}</div></div>`}window.renderHome=renderHome;window.renderCreate=renderCreate;window.renderJoin=renderJoin;window.createRoom=createRoom;window.joinRoom=joinRoom;window.saveSettings=saveSettings;window.lockIdentity=lockIdentity;window.saveGuesses=saveGuesses;window.useAbility=useAbility;window.toggleLang=toggleLang;window.copyInvite=copyInvite;window.showRules=showRules;connect();if(new URLSearchParams(location.search).get('room')){roomCode=new URLSearchParams(location.search).get('room');screen='join';renderJoin()}else render();
</script></body></html>
