<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap');
:root{--ink:#25324d;--soft:#697894;--purple:#7357d8;--purple2:#4e3aab;--yellow:#ffd86a;--coral:#ff8b82;--mint:#65d9ad;--sky:#75c8f4;--pink:#ff9fca;--cream:#fff9ed;--white:#fff;--line:#e8e2f2;--shadow:0 18px 45px #47377c20,0 4px 0 #47377c12}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans Arabic','Baloo 2',sans-serif;background:linear-gradient(150deg,#fff4db,#f2edff 52%,#e4f7ff);overflow-x:hidden}body:before,body:after{content:'';position:fixed;z-index:-1;border-radius:50%;filter:blur(1px);opacity:.6}body:before{width:260px;height:260px;background:var(--yellow);top:-100px;left:-70px}body:after{width:320px;height:320px;background:var(--pink);bottom:-170px;right:-100px}.app{width:min(1240px,100%);margin:auto;padding:22px 20px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:56px;height:56px;border-radius:20px 20px 24px 12px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:33px;font-weight:900;box-shadow:0 7px 0 var(--purple2);transform:rotate(-7deg)}.brand h1{font-size:26px;line-height:1;margin:0}.brand small{color:var(--soft);font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,.icon-btn{border:0;border-radius:15px;padding:12px 17px;font-weight:800;color:var(--ink);background:#ffffffc9;box-shadow:0 5px 16px #49378012;cursor:pointer}.btn:hover,.icon-btn:hover{transform:translateY(-2px)}.btn.primary{background:var(--purple);color:#fff;box-shadow:0 5px 0 var(--purple2)}.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--purple2)}.btn.coral{background:var(--coral);color:#fff}.btn.mint{background:var(--mint)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.card{background:#fffffff0;border:1px solid #fff;border-radius:30px;box-shadow:var(--shadow);padding:24px}.hero{min-height:560px;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;flex-direction:column}.hero-art{position:absolute;inset:auto 3% 6% auto;width:360px;height:360px}.blob{position:absolute;border-radius:44% 56% 62% 38%;transform:rotate(12deg)}.blob.one{width:210px;height:240px;background:var(--yellow);right:40px;bottom:30px}.blob.two{width:170px;height:170px;background:var(--coral);right:130px;bottom:150px;transform:rotate(-15deg)}.blob.three{width:90px;height:90px;background:var(--sky);right:225px;bottom:80px}.detective{position:absolute;right:83px;bottom:60px;font-size:145px;filter:drop-shadow(0 10px 0 #5c478918)}.eyebrow{color:var(--purple);font-weight:900;letter-spacing:.03em;margin-bottom:10px}.hero h2{font-size:clamp(42px,7vw,82px);line-height:.98;max-width:630px;margin:0 0 18px}.hero p{max-width:610px;color:var(--soft);font-size:18px;line-height:1.9;margin:0 0 26px}.actions{display:flex;flex-wrap:wrap;gap:11px}.mini-note{margin-top:22px;padding:12px 16px;border-radius:18px;background:#fff4c8;color:#7a5b18;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:18px}.main-stack{display:grid;gap:18px}.side-stack{display:grid;gap:18px;align-content:start}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.section-head h2,.section-head h3{margin:0}.room-pill{background:#eee8ff;color:var(--purple);padding:8px 12px;border-radius:12px;font-weight:900}.players{display:grid;gap:10px}.player{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:#fff;border:2px solid #f2eef9}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:none}.player-info{flex:1}.player-info b{display:block}.player-info small{color:var(--soft)}.status{font-size:12px;padding:5px 8px;border-radius:10px;background:#dcf8ec;color:#247b59}.status.off{background:#f0edf5;color:#9290a1}.status.out{background:#ffe0eb;color:#a83c67}.log{display:grid;gap:7px;max-height:230px;overflow:auto}.log div{font-size:12px;color:var(--soft);background:#faf8ff;padding:9px 11px;border-radius:12px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:800}.form input,.form select{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}.form input:focus,.form select:focus{border-color:var(--purple)}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:16px;border-radius:19px;background:#eee8ff}.stat:nth-child(2){background:#dcf8ec}.stat:nth-child(3){background:#fff3c9}.stat span{color:var(--soft);font-size:12px;font-weight:800}.stat strong{display:block;font-size:27px;margin-top:4px}.lobby-board{background:linear-gradient(145deg,#e9e3ff,#fff8e7);border-radius:24px;padding:18px;margin-bottom:18px;border:3px solid #fff;box-shadow:inset 0 0 0 1px #dfd6fb}.lobby-title{display:flex;align-items:center;justify-content:space-between}.lobby-title strong{font-size:23px}.ready-dot{width:12px;height:12px;border-radius:50%;background:var(--mint);display:inline-block;margin-inline-start:6px}.ready-dot.wait{background:#dad6e5}.board{position:relative;min-height:580px;border-radius:30px;padding:18px;overflow:hidden;background:radial-gradient(ellipse at center,#fff8dd 0 19%,#98e3c7 20% 42%,#75c8f4 43% 75%,#7560ce 76%);box-shadow:inset 0 0 0 7px #ffffff45,inset 0 0 70px #4335a966}.board:before{content:'';position:absolute;inset:20px;border:3px dashed #ffffff77;border-radius:26px;pointer-events:none}.table-center{position:absolute;inset:22% 19%;border-radius:50%;background:#fffaf0e6;border:5px solid #ffffffbd;box-shadow:0 12px 20px #40328a25;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;z-index:1}.table-center h2{font-size:30px;margin:4px 0 7px}.table-center p{color:var(--soft);line-height:1.7;margin:0;max-width:320px}.table-icon{font-size:52px}.seat-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:100%;min-height:540px;align-content:space-between}.seat{padding:10px;background:#ffffffeb;border:3px solid #fff;border-radius:19px;text-align:center;box-shadow:0 7px 0 #44359933;max-width:150px;justify-self:center}.seat:nth-child(3n+1){transform:rotate(-4deg)}.seat:nth-child(3n){transform:rotate(4deg)}.seat.active{border-color:var(--yellow);box-shadow:0 7px 0 #a86b2066,0 0 0 5px #fff4a966}.seat .avatar{margin:auto;width:48px;height:48px;font-size:21px}.seat b{display:block;font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seat small{display:block;color:var(--soft);font-size:11px}.turn-card{display:grid;gap:15px}.phase-row{display:flex;justify-content:space-between;align-items:center;background:#eee8ff;border-radius:18px;padding:13px 16px}.phase-row strong{font-size:21px}.timer{font-size:37px;font-weight:900;color:var(--purple);font-variant-numeric:tabular-nums}.spotlight{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:12px}.spot{padding:16px;border-radius:20px;background:#fff;border:3px solid #f2edf9;text-align:center}.spot.target{background:#fff1d6;border-color:#ffe1a0}.spot .avatar{margin:auto;width:56px;height:56px;font-size:24px}.spot b{display:block;margin-top:7px}.arrow{font-size:45px;color:var(--coral);font-weight:900;text-align:center}.role-banner{padding:14px 17px;border-radius:17px;font-weight:800}.role-banner.your-turn{background:#dcf8ec;color:#237b59}.role-banner.target-turn{background:#fff1d6;color:#8b651e}.role-banner.waiting{background:#eee8ff;color:#5c4a9d}.role-banner.spectator{background:#f4e2ec;color:#934066}.ability-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ability{border:2px solid #eee8f8;border-radius:18px;background:#fff;padding:13px 9px;color:var(--ink);font-weight:800;cursor:pointer}.ability:hover:not(:disabled){border-color:var(--purple);transform:translateY(-2px)}.ability:disabled{opacity:.38;cursor:not-allowed}.ability i{display:block;font-style:normal;font-size:28px;margin-bottom:5px}.ability small{display:block;color:var(--soft);font-weight:600;font-size:11px}.guess-list{display:grid;gap:10px}.guess-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;background:#fff;padding:11px;border-radius:16px}.guess-row input{width:100%;padding:11px;border:2px solid var(--line);border-radius:11px}.result{padding:17px;border-radius:19px;background:#fff1d6;margin:10px 0}.result strong{font-size:20px}.notice{padding:13px 15px;border-radius:16px;background:#fff3c9;margin:12px 0;font-weight:700}.notice.error{background:#ffe0e5;color:#9e3b52}.notice.success{background:#dcf8ec;color:#257956}.big-win{text-align:center;padding:25px}.big-win .trophy{font-size:90px}.big-win h2{font-size:48px;margin:5px 0}.modal{position:fixed;inset:0;background:#2d236b88;display:grid;place-items:center;padding:18px;z-index:5}.modal.hidden{display:none}.modal .card{max-width:560px;max-height:90vh;overflow:auto}.footer{text-align:center;color:#8790a7;font-size:12px;margin-top:16px}@media(max-width:900px){.app{padding:15px 12px}.layout{grid-template-columns:1fr}.side-stack{order:2}.hero{min-height:590px}.hero-art{opacity:.7;right:-65px;bottom:5px}.hero h2,.hero p{position:relative;z-index:1}.board{min-height:520px}.table-center{inset:24% 8%}.seat-grid{min-height:480px;gap:10px}.spotlight{grid-template-columns:1fr;gap:8px}.arrow{transform:rotate(90deg);font-size:30px}.ability-row{grid-template-columns:1fr}.guess-row{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:21px}}
</style></head>
<body><div id="app"></div><div id="modal" class="modal hidden"></div>
<script>
(()=>{
const app=document.querySelector('#app'),modal=document.querySelector('#modal');let socket=null,state=null,screen='home',lang=localStorage.lang||'ar',roomCode=localStorage.roomCode||'',resumeToken=localStorage.resumeToken||'',timerHandle;
const copy={ar:{brand:'سرّنا بيننا',tag:'طاولة الشك والضحك للأصدقاء',play:'أنشئ غرفة',join:'انضم لغرفة',rules:'طريقة اللعب',name:'اسمك الظاهر',code:'كود الغرفة',create:'إنشاء الغرفة',joinNow:'انضم الآن',back:'رجوع',ready:'أنا جاهز',unready:'لست جاهزًا',start:'ابدأ المباراة',players:'اللاعبون',settings:'إعدادات الطاولة',category:'الفئة',cartoons:'كرتون',anime:'أنمي',movies:'أفلام',people:'أشخاص حقيقيون',items:'أشياء',questionTimer:'وقت السؤال',suspicionTimer:'وقت الاشتباه',guessTimer:'وقت التخمين',save:'حفظ الإعدادات',identity:'هويتك السرية',identityHint:'اكتب شخصية أو غرضًا يناسب الفئة. ستظل سرية حتى إقصائك.',lock:'اقفل الهوية',waiting:'بانتظار بقية اللاعبين',question:'جولة السؤال',suspicion:'جولة الاشتباه',guessing:'جولة التخمين',results:'كشف الجولة',voting:'تصويت طارئ',victory:'النهاية',done:'أنهي السؤال',cancel:'إلغاء السؤال',redirect:'تحويل السؤال',backAbility:'عليّ الدور',finish:'قفل التخمينات',callVote:'طلب تصويت',abstain:'امتناع',playAgain:'العبوا مجددًا',copy:'نسخ الدعوة',copied:'تم النسخ',round:'الجولة',remaining:'ثانية',active:'باقٍ',eliminated:'مقصى',leader:'القائد',spectator:'مشاهد',locked:'مؤكدة',notLocked:'بانتظار التأكيد',publicLog:'أحداث الطاولة',room:'الغرفة',yourTurn:'دورك: اسأل شفهيًا ثم اضغط «أنهي السؤال».',targetTurn:'أنت الهدف: استمع للسؤال. قدراتك فقط متاحة الآن.',waitingTurn:'شاهد الجولة. سيكمل السائل عندما ينتهي.',targetOnly:'هذه القدرات تظهر للهدف فقط',questionerOnly:'زر إنهاء السؤال يظهر للسائل فقط',asking:'يسأل',asked:'يُسأل',rulesText:'كل لاعب يختار هوية سرية. تسألون بعضكم شفهيًا، ثم ترسلون التخمينات سرًا. من تُكتشف هويته يُقصى، وآخر لاعب يبقى يفوز.',tutorial:'اسأل بذكاء، استخدم قدرتك في الوقت المناسب، واحمِ هويتك.',noPlayers:'لا يوجد لاعبون بعد',winnerText:'بقيت آخر شخص على الطاولة!',chooseTarget:'اختر هدف الاشتباه',submitTarget:'تأكيد الهدف',guessHint:'اكتب تخمينًا لكل خصم أو اتركه فارغًا.',noElim:'لا أحد عرف الهوية هذه المرة.',newRoom:'غرفة جديدة',error:'حدث خطأ'},en:{brand:'Secret Suspects',tag:'A colorful social deduction table',play:'Create room',join:'Join room',rules:'How to play',name:'Display name',code:'Room code',create:'Create room',joinNow:'Join now',back:'Back',ready:'Ready',unready:'Unready',start:'Start match',players:'Players',settings:'Table settings',category:'Category',cartoons:'Cartoons',anime:'Anime',movies:'Movies',people:'Real People',items:'Items',questionTimer:'Question time',suspicionTimer:'Suspicion time',guessTimer:'Guess time',save:'Save settings',identity:'Your secret identity',identityHint:'Enter a character or item for the category. It stays private until you are eliminated.',lock:'Lock identity',waiting:'Waiting for all players',question:'Question round',suspicion:'Suspicion round',guessing:'Guessing round',results:'Round reveal',voting:'Emergency vote',victory:'Final table',done:'End question',cancel:'Cancel question',redirect:'Redirect question',backAbility:'Back at you',finish:'Lock guesses',callVote:'Call a vote',abstain:'Abstain',playAgain:'Play again',copy:'Copy invite',copied:'Copied',round:'Round',remaining:'sec',active:'alive',eliminated:'Out',leader:'Leader',spectator:'Spectator',locked:'Locked',notLocked:'Waiting',publicLog:'Table events',room:'Room',yourTurn:'Your turn: ask out loud, then end the question.',targetTurn:'You are the target: listen. Only your abilities are available now.',waitingTurn:'Watch the turn. The questioner will end it.',targetOnly:'Abilities are shown only to the target',questionerOnly:'The end button is shown only to the questioner',asking:'asks',asked:'is asked',rulesText:'Everyone chooses a secret identity. Ask questions out loud, then privately submit guesses. Correctly identified players are eliminated. The last player standing wins.',tutorial:'Ask cleverly, use your ability at the right moment, and protect your identity.',noPlayers:'No players yet',winnerText:'You are the last player at the table!',chooseTarget:'Choose a suspicion target',submitTarget:'Confirm target',guessHint:'Enter a guess for each opponent or leave blank.',noElim:'Nobody found an identity this time.',newRoom:'New room',error:'Something went wrong'}};
const L=()=>copy[lang];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function send(type,data={}){if(socket?.readyState===1)socket.send(JSON.stringify({type,...data}))}
function connect(){if(socket&&socket.readyState<2)return;const proto=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${proto}://${location.host}/ws`);socket.onopen=()=>{if(roomCode)send('join_room',{roomCode,resumeToken,name:localStorage.name||''})};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){state=m;roomCode=m.roomCode;resumeToken=m.me?.resumeToken||resumeToken;localStorage.roomCode=roomCode;localStorage.resumeToken=resumeToken;screen=m.phase==='lobby'?'lobby':m.phase==='identity'?'identity':m.phase;render()}else if(m.type==='error')flash(m.message||L().error,true)};socket.onclose=()=>{if(screen!=='home')flash(lang==='ar'?'انقطع الاتصال، نحاول العودة...':'Connection lost, reconnecting...',true);setTimeout(connect,1200)}}
function flash(msg,err=false){const el=document.querySelector('#flash');if(el){el.className='notice '+(err?'error':'success');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3000)}}
function top(){return `<div class="top"><div class="brand"><div class="mark">?</div><div><h1>${L().brand}</h1><small>${L().tag}</small></div></div><div class="toolbar"><button class="btn" onclick="toggleLang()">${lang==='ar'?'EN':'عربي'}</button>${state?`<button class="btn" onclick="copyInvite()">${L().copy}</button>`:''}</div></div><div id="flash" class="notice hidden"></div>`}
function playerTile(p,active=false){return `<div class="player"><div class="avatar" style="background:${p.color}">${esc(p.name[0]||'?')}</div><div class="player-info"><b>${esc(p.name)}</b><small>${p.id===state.leaderId?'★ '+L().leader+' ':''}${p.eliminated?'· '+L().eliminated:p.spectator?'· '+L().spectator:''}</small></div><span class="status ${p.eliminated?'out':p.connected?'':'off'}">${p.eliminated?'×':p.connected?'●':'○'}</span></div>`}
function side(){if(!state)return '';return `<div class="side-stack"><section class="card"><div class="section-head"><h3>${L().players}</h3><span class="room-pill">${state.players.length}/10</span></div><div class="players">${state.players.map(p=>playerTile(p)).join('')}</div></section><section class="card"><div class="section-head"><h3>${L().publicLog}</h3></div><div class="log">${(state.log||[]).slice().reverse().map(e=>`<div>${esc(e.text)}</div>`).join('')||`<div>${L().noPlayers}</div>`}</div></section></div>`}
function shell(content,withSide=true){return `${top()}${withSide?`<div class="layout"><main class="main-stack">${content}</main>${side()}</div>`:`<main>${content}</main>`}<div class="footer">${L().tutorial}</div>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(!state||screen==='home')return renderHome();if(screen==='lobby')return renderLobby();if(screen==='identity')return renderIdentity();if(screen==='question'||screen==='suspicion')return renderTurn();if(screen==='guessing')return renderGuessing();if(screen==='results')return renderResults();if(screen==='voting')return renderVoting();if(screen==='victory')return renderVictory();renderHome()}
function renderHome(){app.innerHTML=shell(`<section class="card hero"><div class="eyebrow">${L().tag}</div><h2>${lang==='ar'?'طاولتك… أسرارك…<br>فمن سيُكتشف؟':'Your table. Your secrets.<br>Who gets uncovered?'}</h2><p>${L().rulesText}</p><div class="actions"><button class="btn primary" onclick="renderCreate()">${L().play}</button><button class="btn" onclick="renderJoin()">${L().join}</button><button class="btn" onclick="showRules()">${L().rules}</button></div><div class="mini-note">🎙️ ${L().tutorial}</div><div class="hero-art"><div class="blob one"></div><div class="blob two"></div><div class="blob three"></div><div class="detective">🕵️</div></div></section>`,false)}
function auth(mode){return `<section class="card" style="max-width:650px;margin:auto"><div class="section-head"><h2>${mode==='create'?L().create:L().joinNow}</h2><button class="btn" onclick="renderHome()">${L().back}</button></div><div class="form"><label>${L().name}<input id="name" maxlength="24" value="${esc(localStorage.name||'')}" placeholder="${lang==='ar'?'مثال: ليان':'e.g. Alex'}"></label>${mode==='join'?`<label>${L().code}<input id="code" maxlength="8" placeholder="AB12"></label>`:''}<button class="btn primary" onclick="${mode==='create'?'createRoom()':'joinRoom()'}">${mode==='create'?L().create:L().joinNow}</button></div></section>`}
function renderCreate(){app.innerHTML=shell(auth('create'),false)}function renderJoin(){app.innerHTML=shell(auth('join'),false)}
function createRoom(){const name=document.querySelector('#name').value;localStorage.name=name;connect();setTimeout(()=>send('create_room',{name}),150)}function joinRoom(){const name=document.querySelector('#name').value,code=document.querySelector('#code').value.trim().toUpperCase();localStorage.name=name;roomCode=code;connect();setTimeout(()=>send('join_room',{roomCode,name}),150)}
function renderLobby(){const s=state,me=s.players.find(p=>p.id===s.me.id),st=s.settings;app.innerHTML=shell(`<section class="card"><div class="lobby-board"><div class="lobby-title"><div><div class="eyebrow">${L().room} ${s.roomCode}</div><strong>${L().waiting}</strong></div><div class="room-pill">${s.players.length}/10</div></div><div class="grid2" style="margin-top:16px"><div class="stat"><span>${L().category}</span><strong>${L()[st.category]}</strong></div><div class="stat"><span>${L().questionTimer}</span><strong>${st.questionSeconds}s</strong></div></div></div><div class="section-head"><h2>${L().settings}</h2><span class="room-pill">${s.players.filter(p=>p.ready).length}/${s.players.length} ${L().ready||''}</span></div>${s.me.id===s.leaderId?`<div class="form"><label>${L().category}<select id="category">${['cartoons','anime','movies','people','items'].map(c=>`<option value="${c}" ${c===st.category?'selected':''}>${L()[c]}</option>`).join('')}</select></label><label>${L().questionTimer}<select id="qtime">${[15,30,45,60,90].map(x=>`<option ${x===st.questionSeconds?'selected':''}>${x}</option>`).join('')}</select></label><button class="btn" onclick="saveSettings()">${L().save}</button></div>`:''}<div class="actions" style="margin-top:20px"><button class="btn ${me?.ready?'mint':'primary'}" onclick="send('ready')">${me?.ready?L().unready:L().ready}</button>${s.me.id===s.leaderId?`<button class="btn primary" onclick="send('start_match')">${L().start}</button>`:''}<button class="btn coral" onclick="leaveRoom()">${L().back}</button></div></section>`) }
function saveSettings(){send('set_settings',{settings:{category:document.querySelector('#category').value,questionSeconds:Number(document.querySelector('#qtime').value),suspicionSeconds:30,guessSeconds:60,language:lang}})}function leaveRoom(){send('leave');state=null;roomCode='';resumeToken='';localStorage.removeItem('roomCode');localStorage.removeItem('resumeToken');renderHome()}
function renderIdentity(){const s=state,locked=s.me.identityLocked;app.innerHTML=shell(`<section class="card center"><div class="table-icon">🗝️</div><div class="eyebrow">${L().category}: ${L()[s.category]}</div><h2>${locked?L().waiting:L().identity}</h2><p class="muted">${locked?L().locked:L().identityHint}</p>${locked?`<div class="notice success">✓ ${L().locked}</div>`:`<div class="form" style="max-width:520px;margin:22px auto"><input id="identity" maxlength="80" placeholder="${L().identity}"><button class="btn primary" onclick="lockIdentity()">${L().lock}</button></div>`}<div class="grid2" style="max-width:620px;margin:18px auto 0"><div class="stat"><span>${L().players}</span><strong>${s.players.length}</strong></div><div class="stat"><span>${L().active}</span><strong>${s.players.filter(p=>!p.eliminated).length}</strong></div></div></section>`) }
function lockIdentity(){send('set_identity',{identity:document.querySelector('#identity').value})}
function seat(p,active){return `<div class="seat ${active?'active':''}"><div class="avatar" style="background:${p.color}">${esc(p.name[0]||'?')}</div><b>${esc(p.name)}</b><small>${p.eliminated?'× '+L().eliminated:p.id===state.leaderId?'★ '+L().leader:p.connected?'':'○'}</small></div>`}
function board(){const turn=state.currentTurn;const activeIds=turn?[turn.questionerId,turn.targetId]:[];return `<section class="board"><div class="table-center"><div class="table-icon">🎭</div><div class="eyebrow">${L()[state.phase]}</div><h2>${L().round} ${state.round}</h2><p>${L().tutorial}</p></div><div class="seat-grid">${state.players.map(p=>seat(p,activeIds.includes(p.id))).join('')}</div></section>`}
function timerMarkup(end){return `<span class="timer" data-end="${end||0}">--</span>`}
function startTicker(){clearInterval(timerHandle);timerHandle=setInterval(()=>document.querySelectorAll('[data-end]').forEach(e=>{const seconds=Math.max(0,Math.ceil((Number(e.dataset.end)-Date.now())/1000));e.textContent=seconds+' '+L().remaining}),300);}
function renderTurn(){const s=state,t=s.currentTurn,me=s.me,q=s.players.find(p=>p.id===t?.questionerId),target=s.players.find(p=>p.id===t?.targetId),isQ=s.phase==='question',role=me.role||{};let roleBanner=role.isQuestioner?`<div class="role-banner your-turn">🎙️ ${L().yourTurn}</div>`:role.isTarget?`<div class="role-banner target-turn">🎯 ${L().targetTurn}</div>`:me.eliminated?`<div class="role-banner spectator">👀 ${L().spectator}</div>`:`<div class="role-banner waiting">🪑 ${L().waitingTurn}</div>`;let controls='';if(isQ&&role.isTarget)controls=`<div><div class="eyebrow">${L().targetOnly}</div><div class="ability-row"><button class="ability" ${me.abilities.cancel?'disabled':''} onclick="useAbility('cancel')"><i>🛑</i>${L().cancel}<small>${me.abilities.cancel?'✓ '+L().locked:''}</small></button><button class="ability" ${me.abilities.redirect?'disabled':''} onclick="useAbility('redirect')"><i>🔀</i>${L().redirect}<small>${me.abilities.redirect?'✓ '+L().locked:''}</small></button><button class="ability" ${me.abilities.back?'disabled':''} onclick="useAbility('back')"><i>↩️</i>${L().backAbility}<small>${me.abilities.back?'✓ '+L().locked:''}</small></button></div></div>`;if(!isQ&&role.isQuestioner)controls=`<div class="form"><label>${L().chooseTarget}<select id="susTarget">${(t.eligibleIds||[]).map(id=>{const p=s.players.find(x=>x.id===id);return `<option value="${id}" ${id===t.targetId?'selected':''}>${esc(p?.name)}</option>`}).join('')}</select></label><button class="btn" onclick="send('submit_suspicion_target',{targetId:document.querySelector('#susTarget').value})">${L().submitTarget}</button></div>`;app.innerHTML=shell(`${board()}<section class="card turn-card"><div class="phase-row"><div><div class="eyebrow">${L()[s.phase]}</div><strong>${L().round} ${s.round}</strong></div>${timerMarkup(t?.endsAt||s.phaseEndsAt)}</div><div class="spotlight"><div class="spot"><div class="avatar" style="background:${q?.color}">${esc(q?.name?.[0]||'?')}</div><b>${esc(q?.name)}</b><small>${L().asking}</small></div><div class="arrow">→</div><div class="spot target"><div class="avatar" style="background:${target?.color}">${esc(target?.name?.[0]||'?')}</div><b>${esc(target?.name)}</b><small>${L().asked}</small></div></div>${roleBanner}${controls}<div class="actions">${role.isQuestioner?`<button class="btn primary" onclick="send('done_turn')">${L().done}</button>`:''}${(s.phase==='results'||s.phase==='lobby')&&s.settings.voteEnabled?`<button class="btn" onclick="send('call_vote')">${L().callVote}</button>`:''}</div><div class="muted" style="font-size:12px">${role.isQuestioner?L().questionerOnly:''}</div></section>`);startTicker()}
function renderGuessing(){const s=state,opponents=s.players.filter(p=>!p.eliminated&&p.id!==s.me.id),g=s.me.guesses||{};app.innerHTML=shell(`${board()}<section class="card"><div class="phase-row"><div><div class="eyebrow">${L().guessing}</div><strong>${L().round} ${s.round}</strong></div>${timerMarkup(s.phaseEndsAt)}</div><p class="muted" style="margin:15px 0">${L().guessHint}</p><div class="guess-list">${opponents.map(p=>`<div class="guess-row"><b>${esc(p.name)}</b><input data-guess="${p.id}" value="${esc(g[p.id]||'')}" ${s.me.submittedGuesses?'disabled':''} placeholder="${L().identity}"><span>${g[p.id]?'✓':''}</span></div>`).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveGuesses()" ${s.me.submittedGuesses?'disabled':''}>${L().finish}</button>${s.settings.voteEnabled?`<button class="btn" onclick="send('call_vote')">${L().callVote}</button>`:''}</div></section>`);startTicker()}
function saveGuesses(){document.querySelectorAll('[data-guess]').forEach(i=>{if(i.value.trim())send('submit_guess',{targetId:i.dataset.guess,identity:i.value})});setTimeout(()=>send('finish_guesses'),180)}
function renderResults(){const s=state;app.innerHTML=shell(`${board()}<section class="card"><div class="eyebrow">${L().results}</div><h2>${s.results?.length?L().eliminated:L().noElim}</h2>${s.results?.length?s.results.map(r=>`<div class="result"><strong>${esc(r.name)}</strong><div>${esc(r.identity)}</div><small>${r.reason==='vote'?L().voting:(lang==='ar'?'خمنه: ':'Guessed by: ')+esc(r.guessedBy.join(', '))}</small></div>`).join(''):`<div class="notice">${L().noElim}</div>`}</section>`)}
function renderVoting(){const s=state;app.innerHTML=shell(`${board()}<section class="card"><div class="eyebrow">${L().voting}</div><h2>${L().callVote}</h2><p class="muted">${lang==='ar'?'صوّت سرًا على لاعب واحد.':'Privately choose one player.'}</p><div class="players" style="margin-top:16px">${s.vote.targetIds.map(id=>{const p=s.players.find(x=>x.id===id);return `<button class="player" onclick="send('cast_vote',{targetId:'${id}'})"><div class="avatar" style="background:${p.color}">${esc(p.name[0])}</div><div class="player-info"><b>${esc(p.name)}</b></div></button>`}).join('')}<button class="btn" onclick="send('cast_vote',{targetId:null})">${L().abstain}</button></div></section>`)}
function renderVictory(){const s=state;app.innerHTML=shell(`<section class="card big-win"><div class="trophy">🏆</div><div class="eyebrow">${L().victory}</div><h2>${esc(s.winner?.name||'—')}</h2><p>${L().winnerText}</p>${s.winnerIdentity?`<div class="notice success">${L().identity}: <b>${esc(s.winnerIdentity)}</b></div>`:''}<div class="actions" style="justify-content:center;margin-top:18px"><button class="btn primary" onclick="send('play_again')">${L().playAgain}</button><button class="btn" onclick="leaveRoom()">${L().newRoom}</button></div></section>`,false)}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.lang=lang;render()}function useAbility(a){send('use_ability',{ability:a})}function copyInvite(){navigator.clipboard?.writeText(location.origin+'/?room='+state.roomCode);flash(L().copied)}function showRules(){modal.classList.remove('hidden');modal.innerHTML=`<div class="card"><div class="section-head"><h2>${L().rules}</h2><button class="btn" onclick="modal.classList.add('hidden')">×</button></div><p style="line-height:2">${L().rulesText}</p><div class="notice" style="margin-top:16px">${L().tutorial}</div></div>`}
window.renderHome=renderHome;window.renderCreate=renderCreate;window.renderJoin=renderJoin;window.createRoom=createRoom;window.joinRoom=joinRoom;window.saveSettings=saveSettings;window.leaveRoom=leaveRoom;window.lockIdentity=lockIdentity;window.saveGuesses=saveGuesses;window.useAbility=useAbility;window.toggleLang=toggleLang;window.copyInvite=copyInvite;window.showRules=showRules;connect();if(new URLSearchParams(location.search).get('room')){roomCode=new URLSearchParams(location.search).get('room');renderJoin()}else renderHome();
})();
</script></body></html>
